name: Fast Build Optimized - N5000 & K90 Pro Max

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag version to release"
        required: true
        default: "alpha-optimized"
  push:
    paths:
      - '.github/workflows/build-fast-fixed.yml'
    branches: [Alpha]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  REGISTRY: docker.io

jobs:
  prepare-ca:
    runs-on: ubuntu-latest
    outputs:
      ca_ready: ${{ steps.verify-ca.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Mozilla CA certificates
        id: download-ca
        continue-on-error: true
        run: |
          echo "Downloading CA certificates..."
          curl -L -o cacert.pem https://curl.se/ca/cacert.pem
          if [ -s cacert.pem ]; then
            echo "✅ Downloaded $(wc -l cacert.pem | cut -d' ' -f1) certificates"
            cp cacert.pem component/ca/ca-certificates.crt
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  CA download failed"
            echo "ready=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Verify CA file
        id: verify-ca
        run: |
          if [ -s component/ca/ca-certificates.crt ]; then
            echo "✅ CA file ready: $(ls -lh component/ca/ca-certificates.crt)"
            echo "ready=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  CA file empty or missing"
            # Create placeholder
            echo "# CA certificates will be loaded from system" > component/ca/ca-certificates.crt
            echo "ready=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: prepare-ca
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # N5000 Host
          - name: "n5000-openwrt"
            goos: linux
            goarch: amd64
            goamd64: v2
            cgo: "0"
            tags: "with_gvisor"
            ldflags: "-s -w -buildid="
            output: "mihomo-n5000-amd64-v2"
          
          # Redmi K90 Pro Max
          - name: "k90pro-android"
            goos: android
            goarch: arm64
            cgo: "1"
            tags: "with_gvisor"
            ldflags: "-s -w"
            output: "mihomo-k90pro-android-arm64"
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Android NDK
        if: matrix.goos == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29-beta1

      - name: Configure environment
        run: |
          echo "VERSION=${{ inputs.version || github.ref_name || 'dev' }}" >> $GITHUB_ENV
          echo "BUILDTIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV
          
          if [ "${{ matrix.goos }}" = "linux" ]; then
            echo "CGO_ENABLED=0" >> $GITHUB_ENV
            echo "EXTRA_LDFLAGS=-extldflags --static" >> $GITHUB_ENV
          elif [ "${{ matrix.goos }}" = "android" ]; then
            echo "CGO_ENABLED=1" >> $GITHUB_ENV
            echo "CC=${{steps.setup-ndk.outputs.ndk-path}}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang" >> $GITHUB_ENV
          fi

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
        run: |
          set -x
          echo "Building ${{ matrix.name }}..."
          echo "GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=$CGO_ENABLED"
          
          go build -v \
            -tags "${{ matrix.tags }}" \
            -trimpath \
            -ldflags "$EXTRA_LDFLAGS \
                      -X 'github.com/metacubex/mihomo/constant.Version=${{ env.VERSION }}' \
                      -X 'github.com/metacubex/mihomo/constant.BuildTime=${{ env.BUILDTIME }}' \
                      ${{ matrix.ldflags }}" \
            -o mihomo-${{ matrix.output }}
          
          file mihomo-${{ matrix.output }}
          ls -lh mihomo-${{ matrix.output }}

      - name: Package
        run: |
          OUTPUT_NAME="mihomo-${{ matrix.goos }}-${{ matrix.output }}-${{ env.VERSION }}"
          if [ "${{ matrix.goos }}" = "linux" ]; then
            gzip -c mihomo-${{ matrix.output }} > $OUTPUT_NAME.gz
            echo "Created: $OUTPUT_NAME.gz"
            ls -lh $OUTPUT_NAME.gz
          else
            mv mihomo-${{ matrix.output }} $OUTPUT_NAME
            echo "Created: $OUTPUT_NAME"
            file $OUTPUT_NAME
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            mihomo-*
            !mihomo-*/**

  summary:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Show results
        run: |
          echo "✅ Fast build completed!"
          echo ""
          echo "Targets built:"
          echo "1. N5000 Host (linux/amd64 v2, static)"
          echo "2. Redmi K90 Pro Max (android/arm64, NDK API 35)"
          echo ""
          echo "Artifacts are available for download."
