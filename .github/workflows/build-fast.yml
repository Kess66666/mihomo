name: Fast Build - N5000 & K90 Pro Max Only

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag version to release"
        required: true
        default: "alpha-optimized"
  push:
    paths:
      - '.github/workflows/build-fast.yml'
    branches: [Alpha]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  REGISTRY: docker.io

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Get Mozilla CA certificates (fix Android TLS)
        id: get-ca
        run: |
          echo "📥 Downloading full Mozilla CA certificate bundle..."
          curl -L -o /tmp/cacert.pem https://curl.se/ca/cacert.pem
          
          echo "📋 Checking certificate file..."
          if [ -s /tmp/cacert.pem ]; then
            CERT_LINES=$(wc -l /tmp/cacert.pem | cut -d' ' -f1)
            echo "✅ Downloaded CA certificate bundle: $CERT_LINES certificates"
            cp /tmp/cacert.pem component/ca/ca-certificates.crt
            echo "ca_downloaded=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Failed to download CA certificates"
            echo "ca_downloaded=false" >> $GITHUB_OUTPUT
            exit 0  # Continue anyway, Android build might fail but N5000 will work
          fi
          
      - name: Verify CA file
        run: |
          if [ -s component/ca/ca-certificates.crt ]; then
            echo "CA certificates present and non-empty"
            ls -lh component/ca/ca-certificates.crt
          else
            echo "⚠️  CA certificates file is empty or missing"
            # Create dummy file to avoid errors
            echo "# Placeholder CA certificates" > component/ca/ca-certificates.crt
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          # N5000 Host - Intel Jasper Lake (N5000 series)
          - name: "n5000-openwrt"
            description: "N5000 Host with OpenWrt/iStoreOS"
            goos: linux
            goarch: amd64
            goamd64: v2              # Perfect match for N5000 instruction set
            cgo: 0                   # Static compilation for OpenWrt
            tags: "with_gvisor"
            ldflags: "-s -w -buildid="
            output: "mihomo-n5000-amd64-v2"
            artifact: "n5000-openwrt"
            
          # Redmi K90 Pro Max - Snapdragon 8 Elite (Android 16)
          - name: "k90-pro-max-android"
            description: "Redmi K90 Pro Max Android 16"
            goos: android
            goarch: arm64
            ndk: aarch64-linux-android35  # Android 15 API (compatible with 16)
            cgo: 1                   # Enabled for Android native performance
            tags: "with_gvisor,android_cert_embedded"
            ldflags: "-s -w"
            output: "mihomo-k90pro-android-arm64"
            artifact: "k90pro-android"
    
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod

      - name: Setup NDK (Android only)
        if: matrix.target.goos == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29-beta1

      - name: Configure Android NDK
        if: matrix.target.goos == 'android'
        run: |
          echo "CC=${{steps.setup-ndk.outputs.ndk-path}}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{matrix.target.ndk}}-clang" >> $GITHUB_ENV
          echo "CGO_ENABLED=1" >> $GITHUB_ENV

      - name: Configure Linux static build
        if: matrix.target.goos == 'linux'
        run: |
          echo "CGO_ENABLED=0" >> $GITHUB_ENV
          echo "BUILDTAG=-extldflags --static" >> $GITHUB_ENV

      - name: Set Build Environment
        run: |
          echo "VERSION=${{ inputs.version || github.ref_name || github.sha || 'dev' }}" >> $GITHUB_ENV
          echo "BUILDTIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV
          echo "GOTOOLCHAIN=local" >> $GITHUB_ENV

      - name: Build mihomo
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          GOAMD64: ${{ matrix.target.goamd64 }}
          GOARM: ${{ matrix.target.goarm }}
          GOMIPS: ${{ matrix.target.gomips }}
        run: |
          echo "🚀 Building: ${{ matrix.target.description }}"
          echo "Environment: GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=$CGO_ENABLED"
          
          go build -v \
            -tags "${{ matrix.target.tags }}" \
            -trimpath \
            -ldflags "${BUILDTAG} -X 'github.com/metacubex/mihomo/constant.Version=${VERSION}' \
                       -X 'github.com/metacubex/mihomo/constant.BuildTime=${BUILDTIME}' \
                       ${{ matrix.target.ldflags }}" \
            -o mihomo-${{ matrix.target.output }}
          
          # Verify binary
          file mihomo-${{ matrix.target.output }}
          ls -lh mihomo-${{ matrix.target.output }}

      - name: Package artifact
        run: |
          if [ "${{ matrix.target.goos }}" = "linux" ]; then
            # Compress Linux binary
            gzip -c mihomo-${{ matrix.target.output }} > mihomo-${{ matrix.target.goos }}-${{ matrix.target.output }}-${{ env.VERSION }}.gz
            echo "Created: mihomo-${{ matrix.target.goos }}-${{ matrix.target.output }}-${{ env.VERSION }}.gz"
            ls -lh mihomo-${{ matrix.target.goos }}-${{ matrix.target.output }}-${{ env.VERSION }}.gz
          else
            # Android binary (keep uncompressed)
            mv mihomo-${{ matrix.target.output }} mihomo-${{ matrix.target.goos }}-${{ matrix.target.output }}-${{ env.VERSION }}
            echo "Created: mihomo-${{ matrix.target.goos }}-${{ matrix.target.output }}-${{ env.VERSION }}"
            file mihomo-${{ matrix.target.goos }}-${{ matrix.target.output }}-${{ env.VERSION }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.target.artifact }}
          path: |
            mihomo-${{ matrix.target.goos }}-${{ matrix.target.output }}-*.gz
            mihomo-${{ matrix.target.goos }}-${{ matrix.target.output }}-*

  success:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "📊 Build Summary"
          echo ""
          echo "Workflow: Fast Build - N5000 & K90 Pro Max Only"
          echo "Completed at: $(date)"
          echo ""
          echo "Targets attempted:"
          echo "• N5000 Host (OpenWrt/iStoreOS) - linux/amd64 v2 optimized"
          echo "• Redmi K90 Pro Max (Android) - android/arm64 API 35"
          echo ""
          echo "Check the build job for detailed results."
          echo ""
          echo "For Android TLS certificate issues, ensure the CA certificate file was properly downloaded."
