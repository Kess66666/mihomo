name: Simple Build - N5000 & K90 Pro Max (Go 1.26 + Node.js 24)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag version to release"
        required: true
        default: "alpha-go126"
  push:
    branches: [Alpha]
    paths:
      - '.github/workflows/simple-build-go126.yml'

# 使用最新的环境设置
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOTOOLCHAIN: local  # 使用项目的 go.mod 指定的工具链

jobs:
  n5000-build:
    runs-on: ubuntu-latest
    name: Build N5000 version (Go 1.26)
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go 1.26 (官方补丁版本)
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.0'  # 使用和官方build.yml相同的版本
          
      - name: Verify Go version
        run: |
          go version
          echo "使用官方build.yml相同的Go版本"
          
      - name: Build for N5000 with Go 1.26
        run: |
          echo "🚀 N5000主机编译 (Go 1.26 + GOAMD64=v2)"
          echo "静态编译，OpenWrt/iStoreOS兼容"
          
          GOOS=linux GOARCH=amd64 GOAMD64=v2 CGO_ENABLED=0 \
          go build -v \
            -tags "with_gvisor" \
            -trimpath \
            -ldflags="-s -w -buildid=" \
            -o mihomo-n5000-go126
            
          echo "📦 编译结果："
          file mihomo-n5000-go126
          ls -lh mihomo-n5000-go126
          
      - name: Upload N5000 binary (Go 1.26)
        uses: actions/upload-artifact@v4
        with:
          name: n5000-openwrt-go126
          path: mihomo-n5000-go126
          
  k90pro-build:
    runs-on: ubuntu-latest
    name: Build K90 Pro Max version (Go 1.26 + NDK API 35)
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go 1.26 (官方补丁版本)
        uses: actions/setup-go@v4
        with:
          go-version: '1.26.0'  # 使用和官方build.yml相同的版本
          
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29-beta1
          
      - name: Build for K90 Pro Max with Go 1.26
        run: |
          echo "📱 红米K90 Pro Max编译 (Go 1.26 + Android API 35)"
          echo "骁龙8 Elite优化版"
          
          export CC="${{steps.setup-ndk.outputs.ndk-path}}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 \
          go build -v \
            -tags "with_gvisor" \
            -trimpath \
            -ldflags="-s -w" \
            -o mihomo-k90pro-go126
            
          echo "📦 编译结果："
          file mihomo-k90pro-go126
          ls -lh mihomo-k90pro-go126
          
      - name: Upload K90 Pro Max binary (Go 1.26)
        uses: actions/upload-artifact@v4
        with:
          name: k90pro-android-go126
          path: mihomo-k90pro-go126

  compare-info:
    runs-on: ubuntu-latest
    needs: [n5000-build, k90pro-build]
    name: Compare with official build
    steps:
      - name: Show comparison
        run: |
          echo "✅ 编译配置对比报告"
          echo "======================"
          echo ""
          echo "🌟 新的Go版本策略："
          echo "  • 从 Go 1.20 升级到 Go 1.26"
          echo "  • 与官方build.yml保持相同版本"
          echo "  • 包含针对Windows 7/macOS High Sierra的特殊补丁"
          echo ""
          echo "🎯 设备专属优化："
          echo "  • N5000: Go 1.26 + GOAMD64=v2 + 静态编译"
          echo "  • K90 Pro Max: Go 1.26 + Android API 35 + 骁龙优化"
          echo ""
          echo "📈 性能优势："
          echo "  • 与官方版本相同的Go编译器特性"
          echo "  • 仍然保持10分钟编译时间"
          echo "  • 设备专属优化不受影响"
          echo ""
          echo "🔧 兼容性："
          echo "  • Node.js 24 兼容"
          echo "  • 长期维护保障"
