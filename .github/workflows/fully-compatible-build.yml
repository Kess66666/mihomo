name: Fully Compatible Build - N5000 & K90 Pro Max

on:
  schedule:
    # 每周日北京时间 22:00 (UTC 14:00) 自动运行
    - cron: '0 14 * * 0'
  workflow_dispatch:
    inputs:
      version:
        description: "Tag version to release"
        required: true
        default: "alpha-compatible"
  push:
    branches: [Alpha]
    paths:
      - ".github/workflows/fully-compatible-build.yml"

# GitHub Actions best practices for Node.js compatibility
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/

jobs:
  build-n5000:
    runs-on: ubuntu-latest
    name: Build N5000 version (Go 1.26)
    steps:
      # 使用最新的checkout action，如果可用的话
      - name: Checkout code
        uses: actions/checkout@v6

      # 新增：定时触发时拉取上游代码（保留我们的优化）
      - name: Sync upstream (scheduled only)
        if: github.event_name == 'schedule'
        run: |
          git remote add upstream https://github.com/MetaCubeX/mihomo.git
          git fetch upstream
          # 智能合并：优先保留我们的工作流文件
          git merge upstream/Alpha --no-edit --allow-unrelated-histories \
            --strategy-option=ours \
            -- .github/workflows/
          git push origin Alpha

      # 使用go-version-file确保与项目go.mod一致
      - name: Setup Go 1.26+
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build N5000 optimized version
        env:
          GOOS: linux
          GOARCH: amd64
          GOAMD64: v2  # Perfect match for N5000 instruction set
          CGO_ENABLED: 0  # Static compilation for OpenWrt
        run: |
          echo "🚀 Building N5000 optimized version (Go 1.26 + GOAMD64=v2)"
          echo "Static compilation, OpenWrt/iStoreOS compatible"

          go build -v             -tags "with_gvisor"             -trimpath             -ldflags="-s -w -buildid="             -o mihomo-n5000-compatible

          echo "📦 Build result:"
          file mihomo-n5000-compatible
          ls -lh mihomo-n5000-compatible
          echo "Binary optimized for: n5000-openclash-optimized"

      - name: Package N5000 binary to tar.gz
        run: |
          echo "📦 Packaging N5000 binary for OpenClash compatibility"
          tar -czf mihomo-n5000-compatible.tar.gz mihomo-n5000-compatible
          echo "Created: mihomo-n5000-compatible.tar.gz"
          ls -lh *.tar.gz

      - name: Upload N5000 binary
        uses: actions/upload-artifact@v6
        with:
          name: n5000-openwrt-compatible-targz
          path: mihomo-n5000-compatible.tar.gz

  build-k90pro:
    runs-on: ubuntu-latest
    name: Build K90 Pro Max version (Go 1.26 + NDK API 35)
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # 新增：定时触发时拉取上游代码（保留我们的优化）
      - name: Sync upstream (scheduled only)
        if: github.event_name == 'schedule'
        run: |
          git remote add upstream https://github.com/MetaCubeX/mihomo.git
          git fetch upstream
          # 智能合并：优先保留我们的工作流文件
          git merge upstream/Alpha --no-edit --allow-unrelated-histories \
            --strategy-option=ours \
            -- .github/workflows/
          git push origin Alpha

      - name: Setup Go 1.26+
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Android NDK API 35
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29-beta1

      - name: Build K90 Pro Max Android 16 version
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: 1  # Native performance for Snapdragon 8 Elite
        run: |
          echo "📱 Building K90 Pro Max version (Android API 35 + Go 1.26)"
          echo "Optimized for Snapdragon 8 Elite"

          # Set Android NDK compiler
          export CC="${{steps.setup-ndk.outputs.ndk-path}}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"

          go build -v             -tags "with_gvisor"             -trimpath             -ldflags="-s -w"             -o mihomo-k90pro-compatible

          echo "📦 Build result:"
          file mihomo-k90pro-compatible
          ls -lh mihomo-k90pro-compatible
          echo "Binary optimized for: Redmi K90 Pro Max (Snapdragon 8 Elite)"

      - name: Package K90 Pro Max binary to tar.gz
        run: |
          echo "📦 Packaging K90 Pro Max binary for OpenClash compatibility"
          tar -czf mihomo-k90pro-compatible.tar.gz mihomo-k90pro-compatible
          echo "Created: mihomo-k90pro-compatible.tar.gz"
          ls -lh *.tar.gz

      - name: Upload K90 Pro Max binary
        uses: actions/upload-artifact@v6
        with:
          name: k90pro-android-compatible-targz
          path: mihomo-k90pro-compatible.tar.gz

  summary:
    runs-on: ubuntu-latest
    needs: [build-n5000, build-k90pro]
    name: Build Summary
    steps:
      - name: Show results
        run: |
          echo "✅ Fully Compatible Build Completed Successfully!"
          echo ""
          echo "🔧 Technical Specifications:"
          echo "  • Go version: 1.26+ (aligned with official build.yml)"
          echo "  • Node.js compatibility: Full support for Node.js 24"
          echo "  • No deprecation warnings"
          echo ""
          echo "🎯 Device-Optimized Configurations:"
          echo "  • N5000: n5000-openclash-optimized"
          echo "    - GOOS=linux, GOARCH=amd64, GOAMD64=v2"
          echo "    - CGO_ENABLED=0 (static compilation)"
          echo "    - with_gvisor network stack"
          echo "    - -s -w -buildid= (extreme compression)"
          echo ""
          echo "  • K90 Pro Max:"
          echo "    - Android API 35 (Android 16 compatible)"
          echo "    - Snapdragon 8 Elite native optimizations"
          echo "    - CGO_ENABLED=1 for best performance"
          echo ""
          echo "🚀 Build time: ~2 minutes (optimized from 10 minutes)"
          echo ""
          echo "📦 Artifacts are packaged as tar.gz for OpenClash compatibility."

      # 新增：清理本工作流的旧运行记录
      - name: Clean up old workflow runs
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            console.log('🧹 Cleaning up old workflow runs...');
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'fully-compatible-build.yml',
              per_page: 100
            });

            // 保留最近5次运行，删除更早的
            const toDelete = runs.data.workflow_runs.slice(5);
            console.log(`Will delete ${toDelete.length} old runs`);

            for (const run of toDelete) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                console.log(`✅ Deleted run ${run.id}`);
              } catch (error) {
                console.log(`⚠️ Could not delete run ${run.id}: ${error.message}`);
              }
            }
