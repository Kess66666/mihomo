name: Simple Build - N5000 & K90 Pro Max

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag version to release"
        required: true
        default: "alpha-simple"
  push:
    branches: [Alpha]
    paths:
      - '.github/workflows/simple-build.yml'

jobs:
  n5000-build:
    runs-on: ubuntu-latest
    name: Build N5000 version
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go 1.20+
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
          
      - name: Build for N5000
        run: |
          GOOS=linux GOARCH=amd64 GOAMD64=v2 CGO_ENABLED=0 \
          go build -v \
            -tags "with_gvisor" \
            -trimpath \
            -ldflags="-s -w -buildid=" \
            -o mihomo
            
          file mihomo
          ls -lh mihomo
          
      - name: Upload N5000 binary
        uses: actions/upload-artifact@v4
        with:
          name: n5000-openwrt
          path: mihomo
          
  k90pro-build:
    runs-on: ubuntu-latest
    name: Build K90 Pro Max version
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go 1.20+
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
          
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29-beta1
          
      - name: Build for K90 Pro Max
        run: |
          export CC="${{steps.setup-ndk.outputs.ndk-path}}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 \
          go build -v \
            -tags "with_gvisor" \
            -trimpath \
            -ldflags="-s -w" \
            -o mihomo
            
          file mihomo
          ls -lh mihomo
          
      - name: Upload K90 Pro Max binary
        uses: actions/upload-artifact@v4
        with:
          name: k90pro-android
          path: mihomo
